[workspace]
resolver = "2"
members = [
    "crates/nui",
    "crates/soundapp",
    "crates/nui-demo",
]

[workspace.dependencies]
winit = "0.30"
raw-window-handle = "0.6"
softbuffer = "0.4"
glutin = { version = "0.32", default-features = false, features = ["wgl", "egl", "glx", "x11", "wayland", "windows-sys"] }
glutin-winit = { version = "0.5", default-features = false, features = ["wgl", "egl", "glx", "x11", "wayland"] }
glow = "0.18"
tiny-skia = "0.12"
fontdue = "0.9"
swash = "0.2"
cpal = "0.18"
rtrb = "0.4"
symphonia = { version = "0.5", features = ["aac", "adpcm", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rustysynth = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
